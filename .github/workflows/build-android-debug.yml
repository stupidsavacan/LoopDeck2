name: Build Android Debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: loopdeck-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build unsigned debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: List debug APK outputs
        if: always()
        run: |
          echo "APK outputs:"
          find android/app/build/outputs -type f -name "*.apk" -print || true
          echo "Output tree:"
          find android/app/build/outputs -maxdepth 6 -type f -print || true

      - name: Collect debug APK artifacts
        run: |
          set -euo pipefail
          rm -rf artifacts/debug-apk
          mkdir -p artifacts/debug-apk
          find android/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/debug-apk/ \;
          echo "Collected APK artifacts:"
          find artifacts/debug-apk -type f -name "*.apk" -print
          apk_count="$(find artifacts/debug-apk -type f -name "*.apk" | wc -l | tr -d ' ')"
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No debug APKs were collected from android/app/build/outputs."
            exit 1
          fi

      - name: Prune previous debug APK artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "LoopDeck-debug-apk") | .id')"
          if [ -z "$artifact_ids" ]; then
            echo "No previous debug APK artifacts to prune."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              echo "Deleting previous debug APK artifact $artifact_id"
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"

      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-debug-apk
          path: artifacts/debug-apk/*.apk
          if-no-files-found: error
          retention-days: 1
