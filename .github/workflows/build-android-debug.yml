name: LoopDeck CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: Build and upload an unsigned debug APK
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: loopdeck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  web-check:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci --include=dev

      - name: Show installed tool versions
        run: |
          node --version
          npm --version
          npx vite --version
          npx vitest --version

      - name: Run web tests
        run: npm test

      - name: Build LoopDeck web assets
        run: npm run build

      - name: Upload web assets for APK build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: loopdeck-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build-debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: web-check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web assets
        uses: actions/download-artifact@v4
        with:
          name: loopdeck-web-dist
          path: dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build unsigned debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
