name: Build Android Debug APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: loopdeck-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build unsigned debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: List debug APK outputs
        if: always()
        run: |
          echo "APK outputs:"
          find android/app/build/outputs -type f -name "*.apk" -print || true
          echo "Output tree:"
          find android/app/build/outputs -maxdepth 6 -type f -print || true

      - name: Collect debug APK files
        run: |
          set -euo pipefail
          rm -rf artifacts/debug-apk
          mkdir -p artifacts/debug-apk
          find android/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/debug-apk/ \;
          echo "Collected APK files:"
          find artifacts/debug-apk -type f -name "*.apk" -print
          apk_count="$(find artifacts/debug-apk -type f -name "*.apk" | wc -l | tr -d ' ')"
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No debug APKs were collected from android/app/build/outputs."
            exit 1
          fi

      - name: Prune previous APK artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "LoopDeck-debug-apk" or .name == "LoopDeck-signed-release-apk") | [.id, .name] | @tsv')"
          if [ -z "$artifacts" ]; then
            echo "No previous APK artifacts to prune."
            exit 0
          fi
          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [ -n "$artifact_id" ]; then
              echo "Deleting previous APK artifact $artifact_name ($artifact_id)"
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifacts"

      - name: Upload debug APK to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk_path="$(find artifacts/debug-apk -type f -name "*.apk" | sort | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo "::error::No debug APK file was found for release upload."
            exit 1
          fi

          release_tag="debug-apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_title="LoopDeck2 debug APK ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          asset_name="LoopDeck2-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          cp "$apk_path" "$asset_name"

          gh release create "$release_tag" "$asset_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes "Unsigned debug APK built from ${GITHUB_SHA}." \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false
