name: Build Android Signed Release APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: loopdeck-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          LOOPDECK_KEYSTORE_BASE64: ${{ secrets.LOOPDECK_KEYSTORE_BASE64 }}
          LOOPDECK_JKS_BASE64: ${{ secrets.LOOPDECK_JKS_BASE64 }}
          LOOPDECK_KEYSTORE_PASSWORD: ${{ secrets.LOOPDECK_KEYSTORE_PASSWORD }}
          LOOPDECK_STORE_PASSWORD: ${{ secrets.LOOPDECK_STORE_PASSWORD }}
          LOOPDECK_KEY_ALIAS: ${{ secrets.LOOPDECK_KEY_ALIAS }}
          LOOPDECK_KEYSTORE_ALIAS: ${{ secrets.LOOPDECK_KEYSTORE_ALIAS }}
          LOOPDECK_KEY_PASSWORD: ${{ secrets.LOOPDECK_KEY_PASSWORD }}
          LOOPDECK_KEYSTORE_KEY_PASSWORD: ${{ secrets.LOOPDECK_KEYSTORE_KEY_PASSWORD }}
          STUDYHOME_KEYSTORE_BASE64: ${{ secrets.STUDYHOME_KEYSTORE_BASE64 }}
          STUDYHOME_KEYSTORE_PASSWORD: ${{ secrets.STUDYHOME_KEYSTORE_PASSWORD }}
          STUDYHOME_KEY_ALIAS: ${{ secrets.STUDYHOME_KEY_ALIAS }}
          STUDYHOME_KEY_PASSWORD: ${{ secrets.STUDYHOME_KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          KEYSTORE_BASE64="${LOOPDECK_KEYSTORE_BASE64:-${LOOPDECK_JKS_BASE64:-${STUDYHOME_KEYSTORE_BASE64:-}}}"
          KEYSTORE_PASSWORD="${LOOPDECK_KEYSTORE_PASSWORD:-${LOOPDECK_STORE_PASSWORD:-${STUDYHOME_KEYSTORE_PASSWORD:-}}}"
          KEY_ALIAS="${LOOPDECK_KEY_ALIAS:-${LOOPDECK_KEYSTORE_ALIAS:-${STUDYHOME_KEY_ALIAS:-}}}"
          KEY_PASSWORD="${LOOPDECK_KEY_PASSWORD:-${LOOPDECK_KEYSTORE_KEY_PASSWORD:-${STUDYHOME_KEY_PASSWORD:-}}}"

          missing=0
          require_secret() {
            local label="$1"
            local value="$2"
            if [ -z "$value" ]; then
              if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                echo "::error::$label GitHub Secret is required for signed release APK export."
              else
                echo "::notice::$label is not available in this PR run; signed APK packaging will be skipped."
              fi
              missing=1
            fi
          }

          require_secret "LOOPDECK_KEYSTORE_BASE64" "$KEYSTORE_BASE64"
          require_secret "LOOPDECK_KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD"
          require_secret "LOOPDECK_KEY_ALIAS" "$KEY_ALIAS"
          require_secret "LOOPDECK_KEY_PASSWORD" "$KEY_PASSWORD"

          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              exit 1
            fi
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing files
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          LOOPDECK_KEYSTORE_BASE64: ${{ secrets.LOOPDECK_KEYSTORE_BASE64 }}
          LOOPDECK_JKS_BASE64: ${{ secrets.LOOPDECK_JKS_BASE64 }}
          LOOPDECK_KEYSTORE_PASSWORD: ${{ secrets.LOOPDECK_KEYSTORE_PASSWORD }}
          LOOPDECK_STORE_PASSWORD: ${{ secrets.LOOPDECK_STORE_PASSWORD }}
          LOOPDECK_KEY_ALIAS: ${{ secrets.LOOPDECK_KEY_ALIAS }}
          LOOPDECK_KEYSTORE_ALIAS: ${{ secrets.LOOPDECK_KEYSTORE_ALIAS }}
          LOOPDECK_KEY_PASSWORD: ${{ secrets.LOOPDECK_KEY_PASSWORD }}
          LOOPDECK_KEYSTORE_KEY_PASSWORD: ${{ secrets.LOOPDECK_KEYSTORE_KEY_PASSWORD }}
          STUDYHOME_KEYSTORE_BASE64: ${{ secrets.STUDYHOME_KEYSTORE_BASE64 }}
          STUDYHOME_KEYSTORE_PASSWORD: ${{ secrets.STUDYHOME_KEYSTORE_PASSWORD }}
          STUDYHOME_KEY_ALIAS: ${{ secrets.STUDYHOME_KEY_ALIAS }}
          STUDYHOME_KEY_PASSWORD: ${{ secrets.STUDYHOME_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_BASE64="${LOOPDECK_KEYSTORE_BASE64:-${LOOPDECK_JKS_BASE64:-${STUDYHOME_KEYSTORE_BASE64:-}}}"
          KEYSTORE_PASSWORD="${LOOPDECK_KEYSTORE_PASSWORD:-${LOOPDECK_STORE_PASSWORD:-${STUDYHOME_KEYSTORE_PASSWORD:-}}}"
          KEY_ALIAS="${LOOPDECK_KEY_ALIAS:-${LOOPDECK_KEYSTORE_ALIAS:-${STUDYHOME_KEY_ALIAS:-}}}"
          KEY_PASSWORD="${LOOPDECK_KEY_PASSWORD:-${LOOPDECK_KEYSTORE_KEY_PASSWORD:-${STUDYHOME_KEY_PASSWORD:-}}}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/loopdeck-release.jks
          chmod 600 android/loopdeck-release.jks
          keytool -list -keystore android/loopdeck-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/loopdeck-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove release signing files
        if: always()
        run: rm -f android/loopdeck-release.jks android/studyhome-release.jks android/keystore.properties
