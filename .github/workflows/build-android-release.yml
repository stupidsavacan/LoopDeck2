name: Build Android Signed Release APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: loopdeck-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare release signing files
        shell: bash
        env:
          STUDYHOME_KEYSTORE_BASE64: ${{ secrets.STUDYHOME_KEYSTORE_BASE64 }}
          STUDYHOME_KEYSTORE_PASSWORD: ${{ secrets.STUDYHOME_KEYSTORE_PASSWORD }}
          STUDYHOME_KEY_ALIAS: ${{ secrets.STUDYHOME_KEY_ALIAS }}
          STUDYHOME_KEY_PASSWORD: ${{ secrets.STUDYHOME_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in STUDYHOME_KEYSTORE_BASE64 STUDYHOME_KEYSTORE_PASSWORD STUDYHOME_KEY_ALIAS STUDYHOME_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name GitHub Secret is required for signed release APK export."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          printf '%s' "$STUDYHOME_KEYSTORE_BASE64" | base64 --decode > android/studyhome-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/studyhome-release.jks
          storePassword=$STUDYHOME_KEYSTORE_PASSWORD
          keyAlias=$STUDYHOME_KEY_ALIAS
          keyPassword=$STUDYHOME_KEY_PASSWORD
          EOF
          chmod 600 android/studyhome-release.jks android/keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove release signing files
        if: always()
        run: rm -f android/studyhome-release.jks android/keystore.properties
