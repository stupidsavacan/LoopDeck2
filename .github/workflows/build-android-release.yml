name: Build Android Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: loopdeck-android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-signed-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Test web app
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              if [ "$EVENT_NAME" = "pull_request" ]; then
                echo "::notice::$name is not available in this PR run; signed APK packaging will be skipped."
              else
                echo "::error::$name GitHub Secret is required for signed release APK export."
              fi
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT_NAME" != "pull_request" ]; then
              exit 1
            fi
            exit 0
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::notice::KEY_ALIAS is empty; the workflow will use the only alias found in the keystore if possible."
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing files
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/loopdeck-release.jks

          mapfile -t keystore_aliases < <(
            keytool -list -v -keystore android/loopdeck-release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | sed -n 's/^Alias name: //p'
          )

          if [ "${#keystore_aliases[@]}" -eq 0 ]; then
            echo "::error::Could not read any alias from the Android release keystore. Check ANDROID_KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi

          resolved_key_alias="$KEY_ALIAS"
          alias_found=false
          for alias in "${keystore_aliases[@]}"; do
            if [ "$alias" = "$KEY_ALIAS" ]; then
              alias_found=true
              break
            fi
          done

          if [ -z "$resolved_key_alias" ] || [ "$alias_found" != "true" ]; then
            if [ "${#keystore_aliases[@]}" -eq 1 ]; then
              resolved_key_alias="${keystore_aliases[0]}"
              echo "::warning::KEY_ALIAS does not match the keystore; using the only alias found in the keystore."
            else
              echo "::error::KEY_ALIAS does not match any alias in the keystore, and the keystore contains multiple aliases."
              exit 1
            fi
          fi

          cat > android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/loopdeck-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$resolved_key_alias
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/loopdeck-release.jks android/keystore.properties

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: List release APK outputs
        if: steps.signing.outputs.ready == 'true'
        run: |
          echo "APK outputs:"
          find android/app/build/outputs -type f -name "*.apk" -print || true
          echo "Output tree:"
          find android/app/build/outputs -maxdepth 6 -type f -print || true

      - name: Collect release APK artifacts
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf artifacts/release-apk
          mkdir -p artifacts/release-apk
          find android/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/release-apk/ \;
          echo "Collected APK artifacts:"
          find artifacts/release-apk -type f -name "*.apk" -print
          apk_count="$(find artifacts/release-apk -type f -name "*.apk" | wc -l | tr -d ' ')"
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No release APKs were collected from android/app/build/outputs."
            exit 1
          fi

      - name: Prune previous signed release APK artifacts
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate repos/${{ github.repository }}/actions/artifacts --jq '.artifacts[] | select(.name == "LoopDeck-signed-release-apk") | .id')"
          if [ -z "$artifact_ids" ]; then
            echo "No previous signed release APK artifacts to prune."
            exit 0
          fi
          while IFS= read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              echo "Deleting previous signed release APK artifact $artifact_id"
              gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
            fi
          done <<< "$artifact_ids"

      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-signed-release-apk
          path: artifacts/release-apk/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Remove release signing files
        if: always()
        run: rm -f android/loopdeck-release.jks android/keystore.properties
