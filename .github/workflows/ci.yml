name: LoopDeck CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopdeck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  web-check:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package.json

      - name: Install web dependencies
        run: npm install --include=dev

      - name: Show installed tool versions
        run: |
          node --version
          npm --version
          npx vite --version
          npx vitest --version

      - name: Run web tests
        run: npm test

      - name: Build LoopDeck web assets
        run: npm run build

      - name: Build single-file LoopDeck HTML
        run: npm run build:single

      - name: Verify single-file HTML
        run: |
          set -euo pipefail
          test -s LoopDeck-single.html
          echo "Single HTML size: $(wc -c < LoopDeck-single.html) bytes"

      - name: Upload single-file HTML
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-single-html
          path: LoopDeck-single.html
          if-no-files-found: error
          retention-days: 7
