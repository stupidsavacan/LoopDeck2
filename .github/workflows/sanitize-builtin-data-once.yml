name: Sanitize built-in data once

on:
  push:
    branches:
      - codex/clean-origin-words-preserve-leap-numbers

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/clean-origin-words-preserve-leap-numbers
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Remove source-project metadata without touching questions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/builtin/loopdeck_builtin.loopdeck.json';
          const pack = JSON.parse(fs.readFileSync(path, 'utf8'));
          const sourceWording = /studyhome|rescued|rescue/i;

          pack.packId = 'loopdeck-builtin-v1';
          pack.title = 'LoopDeck内蔵教材';
          pack.description = 'シャッフル学習用の内蔵教材です。';
          pack.folders = (pack.folders ?? []).filter((folder) => folder.id !== 'reverse');
          for (const module of pack.modules ?? []) {
            delete module.description;
            module.tags = (module.tags ?? []).filter((tag) => !sourceWording.test(tag));
          }

          fs.writeFileSync(path, `${JSON.stringify(pack, null, 2)}\n`);
          NODE
      - name: Commit sanitized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/builtin/loopdeck_builtin.loopdeck.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove source-project wording from built-in data"
          git push origin HEAD:codex/clean-origin-words-preserve-leap-numbers
